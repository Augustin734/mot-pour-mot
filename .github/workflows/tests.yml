name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      base:
        # Même image que docker-compose.yml.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: motpourmot
          POSTGRES_USER: motpourmot
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motpourmot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://motpourmot:ci@localhost:5432/motpourmot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Migrations à jour avec les modèles
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
